services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paisa
      POSTGRES_USER: paisa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paisa-local-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["paisa-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paisa -d paisa"]
      interval: 5s
      retries: 10
  migrate:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://paisa:${POSTGRES_PASSWORD:-paisa-local-only}@db:5432/paisa
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://paisa:${POSTGRES_PASSWORD:-paisa-local-only}@db:5432/paisa
      SECRET_KEY: ${SECRET_KEY:-local-only-secret-change-for-any-shared-environment-012345}
      FRONTEND_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  paisa-data:
